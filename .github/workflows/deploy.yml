name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Secrets cannot be referenced in step-level `if:` expressions, so
      # expose them as job env vars and test those instead.
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

      # Docker login and push (only when secrets are configured)
      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aiva-backend:latest,${{ secrets.DOCKER_USERNAME }}/aiva-backend:${{ github.sha }}

      - name: Build and push web
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aiva-web:latest,${{ secrets.DOCKER_USERNAME }}/aiva-web:${{ github.sha }}

      # Kubernetes deployment (only when secrets are configured)
      - name: Deploy to Kubernetes
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: Azure/k8s-deploy@v4
        with:
          manifests: |
            infrastructure/k8s/deployment.yaml
          images: |
            ${{ secrets.DOCKER_USERNAME }}/aiva-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/aiva-web:${{ github.sha }}
